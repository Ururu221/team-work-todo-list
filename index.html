<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <main class="card">
      <header class="card__head"><h1>My tasks</h1></header>

      <section class="card__body">
        <form id="createForm" class="row">
          <input id="newInput" type="text" placeholder="New task" autocomplete="off" />
          <button class="btn btn--main" type="submit">Create</button>
        </form>

        <div id="empty" class="empty">
          <img src="12.png" alt="No tasks yet" />
        </div>

        <ul id="list" class="list" aria-live="polite"></ul>

        <footer id="footerBar" class="footer hidden">
          <div id="dd" class="dd" aria-expanded="false" tabindex="0" role="listbox">
            <button type="button" class="dd__btn">
              <span id="ddLabel">All tasks</span>
              <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
            </button>
            <ul class="dd__menu">
              <li class="dd__opt" data-val="all">All tasks</li>
              <li class="dd__opt" data-val="active">Active</li>
              <li class="dd__opt" data-val="completed">Completed</li>
            </ul>
          </div>

          <button id="clearAll" class="btn btn--ghost" type="button">Clear all</button>
        </footer>
      </section>
    </main>
  </div>

  <template id="itemTpl">
    <li class="item" data-id="">
      <input class="item__text" type="text" value="" readonly />
      <div class="actions">
        <button class="act act--ok" data-act="complete" title="Complete" aria-label="Complete">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </button>
        <button class="act act--edit" data-act="edit" title="Edit" aria-label="Edit">
          <svg viewBox="0 0 24 24">
            <path d="M4 20h4l10.5-10.5a2 2 0 0 0-2.828-2.828L5.172 17.172 4 20z"/>
            <path d="M14.5 5.5l4 4"/>
          </svg>
        </button>
        <button class="act act--del" data-act="delete" title="Delete" aria-label="Delete">
          <svg viewBox="0 0 24 24">
            <path d="M6 7h12"/><path d="M9 7V5h6v2"/>
            <path d="M10 11v8M14 11v8"/>
            <path d="M7 7v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V7"/>
          </svg>
        </button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
